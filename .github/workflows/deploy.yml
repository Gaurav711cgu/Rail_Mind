name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "backend/**"          # Only deploy when backend changes
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

jobs:
  deploy-backend:
    name: Deploy Backend → HuggingFace Spaces
    runs-on: ubuntu-latest
    # Only deploy after CI passes
    needs: []

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git for HuggingFace
        run: |
          git config --global user.email "deploy-bot@railmind.ai"
          git config --global user.name "RailMind Deploy Bot"

      - name: Install HuggingFace Hub CLI
        run: pip install huggingface_hub --quiet

      - name: Train and cache RAC model artifact
        working-directory: backend
        run: |
          pip install xgboost scikit-learn numpy pandas joblib --quiet
          python -m app.ml.train_rac_model
        env:
          PYTHONPATH: .

      - name: Push backend to HuggingFace Space
        working-directory: backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}   # e.g. "your-username/railmind-backend"
        run: |
          python - <<'EOF'
          import os

          token = os.environ.get("HF_TOKEN")
          space_id = os.environ.get("HF_SPACE") or "Gaurav711/Rail_Mind"

          if not token:
              print("HF_TOKEN is not configured. Skipping Hugging Face Space upload.")
          elif not space_id:
              print("HF_SPACE is not configured. Skipping Hugging Face Space upload.")
          else:
              from huggingface_hub import HfApi
              api = HfApi(token=token)
              # Upload entire backend directory to the Space
              api.upload_folder(
                  folder_path=".",
                  repo_id=space_id,
                  repo_type="space",
                  commit_message=f"Deploy: {os.environ.get('GITHUB_SHA', 'manual')[:8]}",
                  ignore_patterns=[
                      ".git*",
                      "__pycache__",
                      "*.pyc",
                      "tests/",
                      ".env",
                      "railmind_local.db",
                      "test_railmind.db",
                  ],
              )
              print(f"✓ Deployed to https://huggingface.co/spaces/{space_id}")
          EOF

      - name: Verify deployment health
        env:
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}
        run: |
          # Wait for Space to rebuild (typically 60-120s)
          sleep 90
          SPACE_URL="https://$(echo $HF_SPACE | tr '/' '-').hf.space"
          echo "Checking health at $SPACE_URL/health"
          curl --fail --retry 5 --retry-delay 15 "$SPACE_URL/health" || echo "Health check failed — Space may still be building"

  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}   # HF Spaces URL
        run: npm run build

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured. Skipping Vercel deploy."
          else
            npm install -g vercel --quiet
            vercel deploy --prod --token=$VERCEL_TOKEN --yes
          fi
