name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Deploy Backend (if secrets configured)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Skipping HuggingFace deployment: HF_TOKEN or HF_SPACE_ID repository secret is not set."
            exit 0
          fi

          echo "Configuring git and dependencies for HuggingFace deployment..."
          git config --global user.email "deploy-bot@railmind.ai"
          git config --global user.name "RailMind Deploy Bot"

          pip install huggingface_hub xgboost scikit-learn numpy pandas joblib --quiet
          cd backend
          PYTHONPATH=. python -m app.ml.train_rac_model

          python - <<'PYEOF'
          from huggingface_hub import HfApi
          import os

          token    = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]

          api = HfApi(token=token)
          api.upload_folder(
              folder_path=".",
              repo_id=space_id,
              repo_type="space",
              commit_message=f"deploy: {os.environ.get('GITHUB_SHA', 'manual')[:8]}",
              ignore_patterns=[
                  ".git*",
                  "__pycache__",
                  "*.pyc",
                  "tests/",
                  ".env",
                  "railmind_local.db",
                  "test_railmind.db",
                  "scratch/",
                  ".venv/",
              ],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space_id}")
          PYEOF

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Frontend (if secrets configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Skipping Vercel deployment: VERCEL_TOKEN or VERCEL_PROJECT_ID repository secret is not set."
            exit 0
          fi

          echo "Installing dependencies and building frontend..."
          cd frontend
          npm ci
          npm run build
          npm install -g vercel --quiet
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes
