name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check secrets and deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Skipping HuggingFace deployment: HF_TOKEN or HF_SPACE_ID repository secret is not configured."
            exit 0
          fi
          echo "Secrets present. Proceeding with deployment to HuggingFace Space: $HF_SPACE"

      - name: Configure Git
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
        run: |
          git config --global user.email "deploy-bot@railmind.ai"
          git config --global user.name "RailMind Deploy Bot"

      - uses: actions/setup-python@v5
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
        working-directory: backend
        run: pip install huggingface_hub xgboost scikit-learn numpy pandas joblib --quiet

      - name: Train RAC model artifact
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
        working-directory: backend
        run: python -m app.ml.train_rac_model
        env:
          PYTHONPATH: .

      - name: Push backend to HuggingFace Space
        if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_ID != '' }}
        working-directory: backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PYEOF'
          from huggingface_hub import HfApi
          import os

          token    = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]

          if not token or not space_id:
              print("Skipping deployment: HF_TOKEN or HF_SPACE_ID not set.")
              exit(0)

          api = HfApi(token=token)
          api.upload_folder(
              folder_path=".",
              repo_id=space_id,
              repo_type="space",
              commit_message=f"deploy: {os.environ.get('GITHUB_SHA', 'manual')[:8]}",
              ignore_patterns=[
                  ".git*",
                  "__pycache__",
                  "*.pyc",
                  "tests/",
                  ".env",
                  "railmind_local.db",
                  "test_railmind.db",
                  "scratch/",
                  ".venv/",
              ],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space_id}")
          PYEOF

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Skipping Vercel deployment: VERCEL_TOKEN or VERCEL_PROJECT_ID repository secret is not configured."
            exit 0
          fi
          echo "Secrets present. Deploying frontend to Vercel."

      - uses: actions/setup-node@v4
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: npm ci

      - name: Build
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          npm install -g vercel --quiet
          vercel deploy --prod \
            --token "$VERCEL_TOKEN" \
            --yes
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
