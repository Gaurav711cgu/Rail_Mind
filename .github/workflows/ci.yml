name: RailMind Security & Unit CI Engine

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite & Security SAST Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Run Bandit Security SAST Analysis
        run: |
          cd backend
          bandit -r app/ -ll --skip B105,B106

      - name: Run Pytest Unit Suite
        run: |
          cd backend
          pytest tests/unit -v --tb=short
