# Alembic configuration for RailMind
# See https://alembic.sqlalchemy.org/en/latest/ for full docs.

[alembic]
# Path to migration scripts — relative to this file
script_location = alembic

# Template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend — allows "app." imports from the backend root
prepend_sys_path = .

# Timezone for revision create_date
# timezone =

# Max length of characters to apply to "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision --autogenerate'
# revision_environment = false

# Set to 'true' to allow .hierarchical revision numbering scheme
# version_path_separator = os  # os, space, :

# sqlalchemy.url is intentionally left BLANK here.
# env.py dynamically reads it from app.config.settings.DATABASE_URL
# so we never store credentials in this file.
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format generated revisions with ruff:
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
